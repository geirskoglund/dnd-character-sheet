name: Validate
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hosted Ubuntu already includes Chrome's system libraries. Avoid an apt
      # mirror outage blocking validation; keep Playwright's pinned browser.
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
