name: Validate
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: playwright-results
          run-id: 39398558136
          github-token: ${{ github.token }}
          path: previous-test-results
      - name: Identify previous failed scenarios
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          for p in Path('previous-test-results').rglob('*'):
            if p.is_file():
              print('::notice title=Previous failed scenario::' + str(p))
              if p.name == '.last-run.json':
                print(p.read_text())
          PYTHON
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
