<style>

*{box-sizing:border-box}h1,h2,h3,p,strong,small{overflow-wrap:anywhere}.masthead>div,.dialog-head>div,.summary-title>h2,.effect-row>span{min-width:0}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:transparent;padding:12px 16px;min-height:46px;position:relative;overflow-wrap:anywhere}button:hover{background:#e9ddc640}button:disabled{opacity:.45;cursor:default}input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:13px;background:var(--panel);min-height:48px}textarea{resize:vertical;min-height:120px}input[type=checkbox]{width:22px;min-height:22px;accent-color:var(--accent);flex-shrink:0}input[type=number]{font-variant-numeric:tabular-nums}label{display:block;font-weight:600;margin:0 0 8px}h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400;line-height:1.15}h1{font-size:clamp(2rem,5vw,3rem);margin:8px 0 12px}h2{font-size:1.7rem;margin:0 0 12px}h3{font-size:1.2rem;margin:0 0 10px}p{margin:0 0 16px}small,.muted{color:var(--muted)}small{font-size:.85rem}.eyebrow{font-size:.73rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}svg.icon{width:23px;height:23px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:middle}.shell{max-width:1060px;margin:auto;padding:32px 24px 64px}.masthead{display:flex;align-items:start;justify-content:space-between;gap:24px;padding-bottom:24px;border-bottom:3px double var(--line)}.masthead p{max-width:620px;margin-bottom:0}.tag{font-size:.76rem;border:1px solid var(--soft);border-radius:99px;padding:6px 11px;white-space:nowrap}.intro{padding:28px 0 18px}.scenarios{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 36px}.scenario{text-align:left;display:flex;flex-direction:column;align-items:start;gap:12px;background:var(--panel);padding:20px;min-height:180px}.scenario .icon{color:var(--accent);width:30px;height:30px}.scenario strong{font:1.35rem Georgia}.scenario small{flex:1}.scenario span:last-child{color:var(--accent);font-size:.9rem}.section-title{display:flex;gap:10px;align-items:center;margin-bottom:16px}.section-title:after{content:"";height:1px;background:var(--soft);flex:1}.section-title .icon{color:var(--accent)}.inventory{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,125px),1fr));gap:8px;align-items:stretch}.item-card,.add-card{min-height:116px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;min-width:0}.item-card .icon{color:var(--accent)}.item-card small{font-size:.75rem}.add-card{font-size:2rem;color:var(--accent)}.corner:after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;background:var(--line);clip-path:polygon(100% 0,100% 100%,0 100%);border-radius:0 0 7px 0;pointer-events:none}.state{color:var(--green);font-size:.8rem}.empty{margin:0 0 12px;font-size:.85rem;color:var(--muted)}.draft-box{border:1px dashed var(--line);padding:16px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0}.draft-box p{margin:0}.draft-actions{display:flex;gap:8px;flex-wrap:wrap}.text-button{border:0;color:var(--accent);text-decoration:underline;text-underline-offset:4px;background:transparent}.primary{background:var(--accent);border-color:var(--accent);color:#fff9eb}.primary:hover{background:#73242c}.danger{color:var(--accent)}.bottom-tools{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--soft);padding-top:22px;margin-top:36px}.footnote{margin-top:24px;font-size:.82rem;max-width:760px;color:var(--muted)}.alert{background:#fff1e9;border:2px solid var(--accent);padding:16px;border-radius:8px;margin:16px 0;color:#6f1923}.alert p{margin:0}.alert:empty{display:none}.undo{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}.undo p{margin:0}
dialog{padding:0;border:1px solid var(--line);border-radius:14px;width:min(100% - 32px,680px);max-height:calc(100dvh - 40px);color:var(--ink);background:var(--paper);box-shadow:0 24px 90px #30292040;overflow:hidden}dialog::backdrop{background:#30292080;backdrop-filter:blur(3px)}.dialog-layout{display:flex;flex-direction:column;max-height:calc(100dvh - 42px)}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 26px;border-bottom:1px solid var(--soft);flex-shrink:0}.dialog-head h2{font-size:1.4rem;margin:0}.dialog-head small{display:block;margin-top:4px}.close{padding:0;width:46px;min-width:46px;font-size:1.65rem;font-weight:300}.dialog-body{padding:26px;overflow:auto;overscroll-behavior:contain;min-height:0}.dialog-foot{border-top:1px solid var(--soft);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0;background:var(--panel)}.dialog-foot button{flex:1;min-width:0}.dialog-foot .primary{flex:1.3;min-width:0}.dialog-foot:empty{display:none}.progress{display:flex;align-items:center;gap:7px;justify-content:center;margin:0 0 24px}.progress span{width:8px;height:8px;border:1px solid var(--line);border-radius:50%}.progress .done{background:var(--line)}.progress .active{background:var(--accent);border-color:var(--accent);outline:3px solid #8b2c3418;width:11px;height:11px}.art{width:76px;height:76px;display:grid;place-items:center;margin:0 auto 20px;border:1px solid var(--soft);border-radius:50%;position:relative;color:var(--accent)}.art:before,.art:after{content:"";position:absolute;width:7px;height:7px;border:1px solid var(--line);background:var(--paper);transform:rotate(45deg)}.art:before{left:-4px}.art:after{right:-4px}.art .icon{width:34px;height:34px}.question{text-align:center;margin:0 auto 24px;max-width:500px}.question h2{font-size:1.85rem}.question p{color:var(--muted);font-size:.94rem;margin-bottom:0}.question-form{max-width:480px;margin:auto}.choices{display:grid;gap:10px}.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{text-align:left;background:var(--panel);padding:16px}.choice strong{display:block;font-weight:600}.choice small{display:block;margin-top:5px}.choice[aria-pressed=true],.target[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.die{display:grid;place-items:center;gap:5px;padding:13px 8px}.die svg{width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:1.4}.die span{font-weight:600;color:var(--accent)}.dice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.form-help{display:block;color:var(--muted);font-size:.85rem;margin-top:8px}.number-entry{max-width:180px;display:block;margin:0 auto;text-align:center;font:2rem Georgia;padding:20px}.catalog-search{margin-bottom:22px}.catalog-list{display:grid;gap:10px}.catalog-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.catalog-entry{text-align:left;display:flex;align-items:center;gap:12px;background:var(--panel)}.catalog-entry span{min-width:0}.catalog-entry strong{display:block}.catalog-entry small{display:block;font-size:.82rem;margin-top:3px}.catalog-entry .icon{color:var(--accent)}.create-own{border-top:1px solid var(--soft);padding-top:24px;margin-top:24px}.create-own button{width:100%;text-align:center}.targets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.target{display:flex;align-items:center;gap:8px;text-align:left;font-size:.88rem;padding:12px 10px;background:var(--panel);min-width:0}.target .tick{color:var(--accent);font-size:1rem;flex-shrink:0}.matrix-group{margin:0 0 25px}.matrix-group h3{display:flex;align-items:center;gap:8px;font:600 .85rem -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--muted)}.matrix-group h3 .icon{width:18px;height:18px}.matrix-group h3:after{content:"";height:1px;background:var(--soft);flex:1}.effect-list{display:grid;gap:8px;margin:18px 0}.effect-row{width:100%;display:flex;justify-content:space-between;align-items:center;gap:18px;text-align:left;padding:15px;background:var(--panel)}.effect-row strong{display:block}.effect-row small{display:block;margin-top:3px}.effect-row .value{color:var(--accent);font-weight:600;max-width:50%;text-align:right;overflow-wrap:anywhere}.add-effect{width:100%;border-style:dashed;color:var(--accent);margin:10px 0}.summary-title{display:flex;align-items:center;gap:12px;margin:4px 0 12px}.summary-title .icon{color:var(--accent);width:32px;height:32px}.summary-title h2{margin:0;flex:1}.base-summary{color:var(--muted);font-size:.9rem;margin-bottom:22px}.quick-controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toggle{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-height:48px;margin:0;font-weight:500}.quick-controls .choice{padding:10px 14px}.note{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px 0;margin:0;border-top:1px solid var(--soft)}.note:empty{display:none}.disclosure{margin:22px 0}.disclosure summary{position:relative;list-style:none;border:1px solid var(--line);border-radius:8px;cursor:pointer;padding:13px 18px;min-height:46px;font-weight:600}.disclosure summary::-webkit-details-marker{display:none}.disclosure summary:after{content:"";position:absolute;right:0;bottom:0;width:10px;height:10px;background:var(--line);clip-path:polygon(100% 0,100% 100%,0 100%);border-bottom-right-radius:7px}.disclosure[open] summary{border-bottom-left-radius:0;border-bottom-right-radius:0}.disclosure .disclosure-content{padding:16px;border:1px solid var(--soft);border-top:0}.disclosure-content p:last-child{margin-bottom:0}.detail-section{margin-top:26px}.detail-section h3{font-size:1.35rem}.read-effects .read-effect{padding:14px 0;border-top:1px solid var(--soft)}.read-effect strong{display:block}.read-effect p{margin:5px 0 0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.resource-counter{display:flex;align-items:center;gap:12px;margin-top:12px}.resource-counter button{width:46px;min-width:46px;padding:4px;font-size:1.2rem}.resource-counter output{font-variant-numeric:tabular-nums;font-weight:600}.resource-counter small{margin-left:auto}.edit-tools{margin-top:28px;display:grid;gap:14px}.destructive{margin-top:32px;padding-top:26px;border-top:1px solid var(--soft)}.properties{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.properties span{font-size:.8rem;padding:4px 8px;border:1px solid var(--soft);border-radius:5px}.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,textarea,select{scroll-margin:20px}.dialog-body>*:last-child{margin-bottom:0}.example-note{font-size:.8rem;margin:0 0 20px;color:var(--muted)}.settings-grid{display:grid;gap:22px}.helper-empty{padding:20px;border:1px dashed var(--soft);border-radius:8px;color:var(--muted);text-align:center}.count-chip{border:1px solid var(--soft);border-radius:50%;font:600 .8rem sans-serif;width:25px;height:25px;display:grid;place-items:center}.error-inline{color:var(--accent);font-weight:600;margin-bottom:12px}
@media(max-width:720px){.shell{padding:22px 18px 40px}.masthead{gap:12px}.tag{display:none}.scenarios{grid-template-columns:1fr}.scenario{min-height:0;display:grid;grid-template-columns:32px 1fr;gap:8px 14px;padding:16px}.scenario .icon{grid-row:span 3}.scenario small,.scenario span:last-child{grid-column:2}.inventory{grid-template-columns:1fr;gap:28px}.pills{grid-template-columns:repeat(auto-fill,minmax(min(100%,120px),1fr))}.draft-box{align-items:start;flex-direction:column}dialog{width:calc(100% - 16px);max-height:calc(100dvh - 16px);border-radius:10px}.dialog-layout{max-height:calc(100dvh - 18px)}.dialog-body{padding:22px 18px}.dialog-head{padding:14px 18px}.dialog-foot{padding:14px 18px}.targets{grid-template-columns:repeat(2,minmax(0,1fr))}.question h2{font-size:1.6rem}.catalog-row{grid-template-columns:minmax(0,1fr) auto}.catalog-entry{padding:12px 10px}.catalog-row>button:last-child{padding:10px}.resource-counter{flex-wrap:wrap}.resource-counter small{margin-left:0;width:100%}.choices.three{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom-tools{justify-content:start}}
@media(prefers-reduced-motion:no-preference){dialog[open]{animation:arrive .16s ease-out}@keyframes arrive{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}}
</style>

<body>
<main class="shell" id="workspace"></main>
<dialog id="editor" aria-labelledby="dialog-title"></dialog>
<script>
'use strict';
// Standalone interaction study: no app imports, network, service worker or character data.
const KEY='dnd-equipment-study-v1';
const $=s=>document.querySelector(s);
const clone=v=>JSON.parse(JSON.stringify(v));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'study-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const paths={sword:'M5 19 17 7m-2-3 5 0 0 5M4 14l6 6M3 21l3-3M7 16l9-12 4 4-12 9',shield:'M12 3 3 6v6c0 5 9 9 9 9s9-4 9-9V6l-9-3Zm0 3v12M7 10h10',amulet:'M7 3 4 8l8 6 8-6-3-5M12 14v2m-4 3 4-4 4 4-4 4-4-4',spark:'m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Zm6 0v4m-2-2h4',bag:'M7 8V6a5 5 0 0 1 10 0v2M5 8h14l2 14H3L5 8Zm3 5h8v5H8z',heart:'M12 21 3 12C-3 4 7-1 12 6c5-7 15-2 9 6l-9 9Z',book:'M12 5C8 2 4 3 2 4v16c4-2 7-1 10 1 3-2 6-3 10-1V4c-2-1-6-2-10 1Zm0 0v16',check:'m5 12 4 4L20 5',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4v5l4 2',arrow:'M4 12h16m-6-6 6 6-6 6',armor:'m8 3 4 3 4-3 5 6-4 3v9H7v-9L3 9l5-6Zm0 0v6l4 3 4-3V3'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.spark}"/></svg>`;
const groups={weapon:'Våpen',armor:'Armor og skjold',other:'Annet utstyr'};
const groupIcon=g=>({weapon:'sword',armor:'shield',other:'bag'}[g]);
const bases=[
{id:'warhammer',name:'Warhammer',group:'weapon',icon:'sword',summary:'1d8 bludgeoning',detail:'Martial melee weapon. Versatile: 1d10 med to hender.',grips:true,properties:['Versatile']},
{id:'longsword',name:'Longsword',group:'weapon',icon:'sword',summary:'1d8 slashing',detail:'Martial melee weapon. Versatile: 1d10 med to hender.',grips:true,properties:['Versatile']},
{id:'dagger',name:'Dagger',group:'weapon',icon:'sword',summary:'1d4 piercing',detail:'Simple melee weapon. Finesse, light, thrown (20/60 ft.).',thrown:true,properties:['Finesse','Light','Thrown 20/60 ft.']},
{id:'shortbow',name:'Shortbow',group:'weapon',icon:'sword',summary:'1d6 piercing',detail:'Simple ranged weapon. Ammunition (80/320 ft.), two-handed.',properties:['Ammunition 80/320 ft.','Two-handed']},
{id:'greataxe',name:'Greataxe',group:'weapon',icon:'sword',summary:'1d12 slashing',detail:'Martial melee weapon. Heavy, two-handed.',properties:['Heavy','Two-handed']},
{id:'leather',name:'Leather',group:'armor',icon:'armor',summary:'AC 11 + Dexterity modifier',detail:'Light armor. Hele settet registreres som én gjenstand.',properties:['Light armor']},
{id:'chainmail',name:'Chain Mail',group:'armor',icon:'armor',summary:'AC 16',detail:'Heavy armor. Strength 13; disadvantage på Stealth. Hele settet registreres samlet.',properties:['Heavy armor','Strength 13','Stealth disadvantage']},
{id:'shield',name:'Shield',group:'armor',icon:'shield',summary:'+2 AC',detail:'Skjold gir +2 AC når det brukes. Grunnverdien følger skjoldet.',properties:['Shield']},
{id:'amulet',name:'Amulett',group:'other',icon:'amulet',summary:'Vanlig amulett · ingen magisk effekt',detail:'Dette er vanlig utstyr. Eventuelle magiske virkninger registrerer du selv.',properties:[]},
{id:'ring',name:'Ring',group:'other',icon:'spark',summary:'Eget smykke · ingen magisk effekt',detail:'Et generisk eksempelgrunnlag for denne prøven, ikke en katalogført magisk gjenstand.',properties:[]},
{id:'cloak',name:'Kappe',group:'other',icon:'bag',summary:'Vanlig kappe · ingen magisk effekt',detail:'En kappe uten automatiske bonuser. Legg bare til virkninger som faktisk gjelder.',properties:[]}
];
const baseOf=i=>bases.find(b=>b.id===i.baseId);
const itemName=i=>i.name?.trim()||baseOf(i)?.name||'Uten navn';
const itemIcon=i=>baseOf(i)?.icon||groupIcon(i.group);
const abilities=['Strength','Dexterity','Constitution','Intelligence','Wisdom','Charisma'];
const skills=['Acrobatics','Animal Handling','Arcana','Athletics','Deception','History','Insight','Intimidation','Investigation','Medicine','Nature','Perception','Performance','Persuasion','Religion','Sleight of Hand','Stealth','Survival'];
const damageTypes=['Acid','Bludgeoning','Cold','Fire','Force','Lightning','Necrotic','Piercing','Poison','Psychic','Radiant','Slashing','Thunder'];
const conditions=['Blinded','Charmed','Deafened','Frightened','Grappled','Incapacitated','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious'];
const targets=[...abilities.map(name=>({id:'ability:'+name,name,group:'Ability scores',icon:'heart',kind:'number'})),
...['AC','Angrep','Skade','Initiative','Speed','Maks HP'].map(name=>({id:'combat:'+name,name,group:'Kamp og bevegelse',icon:'sword',kind:'number'})),
{id:'extra',name:'Ekstraskade',group:'Kamp og bevegelse',icon:'sword',kind:'extra'},
{id:'skill',name:'Skill',group:'Ferdigheter og saves',icon:'book',kind:'skill'},
{id:'save',name:'Saving throw',group:'Ferdigheter og saves',icon:'book',kind:'save'},
{id:'resistance',name:'Resistance',group:'Beskyttelse',icon:'shield',kind:'defense'},
{id:'immunity',name:'Immunity',group:'Beskyttelse',icon:'shield',kind:'immunity'},
{id:'vulnerability',name:'Vulnerability',group:'Beskyttelse',icon:'shield',kind:'defense'},
{id:'ability',name:'Egen evne',group:'Andre evner',icon:'spark',kind:'ability'}];
const targetOf=e=>targets.find(t=>t.id===e.target);
const rechargeLabels={short:'Short rest',long:'Long rest',dawn:'Daggry',manual:'Manuelt'};
let storageError='',storageBlocked=false;
const emptyState=()=>({version:1,items:[],draft:null,removed:null});
function validItem(i){return i&&typeof i.id==='string'&&['weapon','armor','other'].includes(i.group)&&typeof i.name==='string'&&Array.isArray(i.effects)&&i.effects.every(e=>e&&typeof e.id==='string'&&targets.some(t=>t.id===e.target));}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return emptyState();const s=JSON.parse(raw);if(s.version!==1||!Array.isArray(s.items)||!s.items.every(validItem)||s.draft&&(!validItem(s.draft.item)||typeof s.draft.screen!=='string'))throw Error('format');return s;}catch(e){storageError='Prøvedata kunne ikke leses. Dataene er ikke overskrevet. Du kan fortsatt prøve i denne økten, eller velge «Tilbakestill prøven».';storageBlocked=true;return emptyState();}}
let state=load(),active=null,lastFocus=null;
function persist(){if(storageBlocked){showStorageError();return;}try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageError='Prøven kunne ikke lagres i nettleseren. Svarene er fortsatt her, men kan gå tapt når filen lukkes. La filen være åpen, eller last ned prøvedata før du lukker.';showStorageError();}}
function showStorageError(){for(const el of document.querySelectorAll('[data-storage-error]'))el.innerHTML=storageError?`<p>${esc(storageError)}</p>`:'';}
function home(){
const d=state.draft;
$('#workspace').innerHTML=`<header class="masthead"><div><span class="eyebrow">D&D Character Companion · arbeidsflytstudie</span><h1>Utstyrsverksted</h1><p class="muted">Prøv å føre en gjenstand som på et karakterark. Alt her er separate prøvedata.</p></div><span class="tag">Lokal, klikkbar prototype</span></header>
<div class="alert" role="alert" data-storage-error></div>
<section class="intro" aria-labelledby="try-title"><h2 id="try-title">Tre situasjoner å prøve</h2><p class="muted">Start med en situasjon, eller legg til noe selv i utstyrslisten nedenfor.</p><div class="scenarios">
<button class="scenario corner" data-action="scenario" data-value="weapon">${icon('sword')}<strong>Et våpen med noe ekstra</strong><small>Warhammer → eget navn → 1d4 fire når hammeren damper.</small><span>Prøv våpen ${icon('arrow')}</span></button>
<button class="scenario corner" data-action="scenario" data-value="amulet">${icon('amulet')}<strong>En magisk amulett</strong><small>Én gjenstand som setter Constitution til 19 og gir en immunitet.</small><span>Prøv amulett ${icon('arrow')}</span></button>
<button class="scenario corner" data-action="scenario" data-value="ability">${icon('spark')}<strong>En evne med tre bruk</strong><small>Beskriv evnen selv, og la den få tre bruk per long rest.</small><span>Prøv egen evne ${icon('arrow')}</span></button>
</div></section>
${d?`<aside class="draft-box"><div><span class="eyebrow">Utkast</span><p><strong>${esc(itemName(d.item))}</strong>${d.originalId?' · uferdig redigering':''}</p><small>Svarene og stedet du stoppet er bevart.</small></div><div class="draft-actions"><button class="primary" data-action="resume">Fortsett</button><button class="text-button" data-action="discard">Forkast utkast</button></div></aside>`:''}
${state.removed?`<aside class="undo"><p>«${esc(itemName(state.removed))}» er fjernet fra prøvelisten.</p><button data-action="undo">Angre fjerning</button></aside>`:''}

function dialogFrame(title,body,footer='',subtitle=''){

}

function go(screen){const d=state.draft;d.history.push({screen:d.screen});d.screen=screen;persist();renderWizard();}
function effectSummary(e){const target=targetOf(e);if(!target)return {title:'Ukjent virkning',value:''};
if(target.kind==='number'||target.kind==='skill'||target.kind==='save'){const n=Number(e.amount);return {title:target.kind==='skill'?e.subject:target.kind==='save'?`${e.subject} saving throw`:target.name,value:e.operation==='set'?`Settes til ${n}`:`${n>=0?'+':''}${n}`};}

return {title:e.description||'Egen evne',value:e.limited?`${e.remaining??e.max} / ${e.max} · ${rechargeLabels[e.recharge]||'Manuelt'}`:'Ingen bruksteller'};}

function progress(stage){
let labels=['Navn','Virkninger'],index=Math.min(stage,1);

if(d?.screen==='effect'){
const e=d.effectWork,t=targetOf(e);
if(t.kind==='number')labels=['operation','amount','condition-ask'];
else if(t.kind==='skill'||t.kind==='save')labels=[t.kind,'amount','condition-ask'];
else if(t.kind==='extra')labels=['die','count','damage-type','condition-ask'];
else if(t.kind==='immunity')labels=['immunity-kind',e.immunityKind==='condition'?'condition-type':'damage-type','condition-ask'];
else if(t.kind==='defense')labels=['damage-type','condition-ask'];
else labels=['description','limited',...(e.limited?['maximum','recharge']:[])];
if(e.condition||d.effectQ==='condition-text')labels.push('condition-text');
index=Math.max(0,labels.indexOf(d.effectQ));
}
return `<div class="progress" role="img" aria-label="Fremdrift: ${index+1} av ${labels.length} spørsmål i denne delen">${labels.map((n,k)=>`<span class="${k<index?'done':k===index?'active':''}"></span>`).join('')}</div>`;
}
function question(title,help,content,art='spark',stage=1){return `${progress(stage)}<div class="art">${icon(art)}</div><div class="question"><h2>${esc(title)}</h2>${help?`<p>${esc(help)}</p>`:''}</div>${content}`;}
function inputField(label,key,value,type='text',extra=''){return `<label for="answer">${esc(label)}</label><input id="answer" name="answer" data-field="${key}" type="${type}" value="${esc(value)}" ${extra}>`;}
function textField(label,key,value,extra=''){return `<label for="answer">${esc(label)}</label><textarea id="answer" name="answer" data-field="${key}" ${extra}>${esc(value)}</textarea>`;}
function answerForm(content){return `<form id="answer-form" class="question-form">${content}<button type="submit" hidden tabindex="-1">Neste</button></form>`;}

function renderWizard(){if(!state.draft)return;active={type:'wizard'};const d=state.draft,i=d.item,b=baseOf(i);let content='',footer='';

}else if(d.screen==='effect'){

}else if(d.screen==='settings'){

}else if(d.screen==='note'){

}else if(d.screen==='quantity'){
content=question('Hvor mange har du?','Vanligvis én. Dette er antall gjenstander, ikke antall bruk av en evne.',answerForm(inputField('Antall','item.quantity',i.quantity,'number','min="1" max="999" step="1" required class="number-entry" data-autofocus')),itemIcon(i),2);footer=`${back}<button class="primary" data-action="setting-next">Behold antallet</button>`;
}else if(d.screen==='attunement'){

}

}
function beginEffect(target,e=null){const d=state.draft;d.history.push({screen:d.screen});d.screen='effect';d.effectHistory=[];const resume=d.effectWork?.target===target&&(e?d.effectWork.id===e.id:!d.effectOriginal);if(!resume){d.effectWork=e?clone(e):{id:uid(),target};d.effectOriginal=e?clone(e):null;}const t=targetOf(d.effectWork);d.effectQ=firstQuestion(t);persist();renderWizard();}
function firstQuestion(t){return t.kind==='number'?'operation':t.kind==='extra'?'die':t.kind==='skill'?'skill':t.kind==='save'?'save':t.kind==='immunity'?'immunity-kind':t.kind==='defense'?'damage-type':'description';}
function effectGo(q){if(q==='done'){saveEffect();return;}const d=state.draft;d.effectHistory.push(d.effectQ);d.effectQ=q;d.screen='effect';persist();renderWizard();}
function effectQuestion(){const d=state.draft,e=d.effectWork,t=targetOf(e);const title=t.kind==='skill'?e.subject||'Skill':t.kind==='save'?`${e.subject||''} saving throw`:t.name;let titleText='',help='',content='',next=false;
switch(d.effectQ){

case 'amount':titleText=e.operation==='set'?`Hva settes ${title} til?`:`Hva er bidraget til ${title}?`;help=e.operation==='set'?'Grunnverdien beholdes. Gjenstanden beskriver den faste verdien som skal gjelde.':'Bruk et positivt eller negativt heltall. Bare denne virkningen registreres her.';content=answerForm(inputField('Verdi','effect.amount',e.amount??'','number',`required min="${e.operation==='set'?0:-100}" max="999" step="1" class="number-entry" data-autofocus`));next=true;break;
case 'skill':titleText='Hvilken skill påvirkes?';help='Velg ferdigheten som får bidraget.';content=`<div class="choices two">${skills.map(v=>choice(v,'subject',v)).join('')}</div>`;break;
case 'save':titleText='Hvilke saving throws påvirkes?';help='Velg én ability eller alle saving throws.';content=`<div class="choices two">${[...abilities,'Alle saving throws'].map(v=>choice(v,'subject',v)).join('')}</div>`;break;
case 'die':titleText='Hvilken terning gir ekstraskaden?';help='Grunnskaden følger våpenet. Dette er en separat skade som kommer i tillegg.';content=`<div class="dice">${[4,6,8,10,12,20].map(n=>`<button class="die" aria-label="d${n}" data-action="die" data-value="${n}"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 44 17v18L24 45 4 35V17L24 3Zm0 0v42M4 17l20 9 20-9M4 35l20-9 20 9"/></svg><span>d${n}</span></button>`).join('')}</div>`;break;
case 'count':titleText=`Hvor mange d${e.die}?`;help='Antall terninger du kaster for akkurat denne ekstraskaden.';content=answerForm(inputField('Antall terninger','effect.count',e.count??1,'number','required min="1" max="99" step="1" class="number-entry" data-autofocus'));next=true;break;
case 'immunity-kind':titleText='Hva gir den immunitet mot?';help='Skadeimmunitet og tilstandsimmunitet er forskjellige ting.';content=`<div class="choices">${choice('En skadetype','immunity-kind','damage','For eksempel fire eller poison damage.')}${choice('En tilstand','immunity-kind','condition','For eksempel frightened eller poisoned.')}</div>`;break;
case 'damage-type':titleText=t.kind==='extra'?'Hvilken skadetype?':`Hvilken skadetype gjelder ${t.name.toLowerCase()}?`;help=t.kind==='extra'?'Typen til denne ekstraskaden. Den endrer ikke våpenets grunnskadetype.':'Velg typen som er angitt på gjenstanden.';content=`<div class="choices three">${damageTypes.map(v=>choice(v,'damage-type',v)).join('')}</div>`;break;

case 'condition-text':titleText='Når gjelder virkningen?';help='Skriv betingelsen slik du ville notert den på arket. Teksten følger denne virkningen.';content=answerForm(textField('Betingelse','effect.condition',e.condition||'','maxlength="500" required placeholder="Når …" data-autofocus'));next=true;break;

function back(){const d=state.draft;if(d.screen==='effect'&&d.effectHistory.length){d.effectQ=d.effectHistory.pop();}else{const h=d.history.pop();if(h)d.screen=h.screen;else d.screen='name';}persist();renderWizard();}
function capture(){const form=$('#answer-form');if(form&&!form.reportValidity())return false;if(form){const field=form.querySelector('[data-field]');if(field){const value=field.type==='number'?Number(field.value):field.value.trim();const [owner,key]=field.dataset.field.split('.');(owner==='item'?state.draft.item:state.draft.effectWork)[key]=value;}}persist();return true;}

function showItem(id){const i=state.items.find(v=>v.id===id);if(!i)return;active={type:'detail',id};const b=baseOf(i);dialogFrame(itemName(i),`
<p class="base-summary">${icon(itemIcon(i))} ${b?`${esc(b.name)} · ${esc(b.grips&&i.grip==='two'?b.summary.replace('1d8','1d10'):b.summary)}`:'Egen gjenstand'}</p>
<div class="quick-controls"><label class="toggle"><input type="checkbox" data-quick="equipped" ${i.equipped?'checked':''}>I bruk</label>${i.requiresAttunement?`<label class="toggle"><input type="checkbox" data-quick="attuned" ${i.attuned?'checked':''}>Attuned</label>`:''}</div>
${b?.grips?`<div class="quick-controls" role="group" aria-label="Håndbruk"><button class="choice" data-action="grip" data-value="one" aria-pressed="${i.grip==='one'}">Én hånd · 1d8</button><button class="choice" data-action="grip" data-value="two" aria-pressed="${i.grip==='two'}">To hender · 1d10</button></div>`:''}
${b?.thrown?`<div class="quick-controls" role="group" aria-label="Angrepsmåte"><button class="choice" data-action="attack-mode" data-value="melee" aria-pressed="${i.attackMode==='melee'}">Melee</button><button class="choice" data-action="attack-mode" data-value="thrown" aria-pressed="${i.attackMode==='thrown'}">Thrown</button></div>`:''}
${i.requiresAttunement&&!i.attuned?'<p class="form-help">Krever attunement. Virkningene vises som oppslag, men prøven beregner ingen karakterverdier.</p>':''}
<section class="detail-section"><h3>Virkninger</h3><div class="read-effects">${i.effects.map(e=>effectLine(e,i)).join('')||'<p class="muted">Ingen ekstra virkninger registrert.</p>'}</div></section>
${i.note?`<section class="detail-section"><h3>Merknad</h3><p class="note">${esc(i.note)}</p></section>`:''}
${b?`<details class="disclosure"><summary>Grunnlag fra ${esc(b.name)}</summary><div class="disclosure-content"><p>${esc(b.detail)}</p><div class="properties">${b.properties.map(p=>`<span>${esc(p)}</span>`).join('')}</div><p class="muted"><small>Arvet grunnprofil og ikon. Ingen valg om å redigere disse i denne prøven.</small></p></div></details>`:''}
${i.quantity!==1?`<p class="muted">Antall: ${i.quantity}</p>`:''}
<div class="edit-tools"><button class="corner" data-action="edit-item" data-value="${i.id}">Rediger gjenstanden</button></div>
<div class="destructive"><button class="danger" data-action="remove-item" data-value="${i.id}">Fjern fra utstyrslisten</button><p class="form-help">Fjerner oppføringen fra prøvelisten. For å legge den bort, slå av I bruk.</p></div>`, '', 'Oppslag · bruk og egenskaper');}
function counter(id,delta){const i=state.items.find(v=>v.id===active.id),e=i?.effects.find(v=>v.id===id);if(!e?.limited)return;e.remaining=Math.max(0,Math.min(e.max,e.remaining+delta));persist();home();showItem(i.id);}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='utstyrsverksted-provedata.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.input==='search'){active.query=el.value;const list=bases.filter(b=>b.group===active.group&&b.name.toLowerCase().includes(active.query.toLowerCase()));$('#catalog-results').innerHTML=catalogResults(list,active.group);return;}if(el.dataset.field&&state.draft){const [owner,key]=el.dataset.field.split('.');const obj=owner==='item'?state.draft.item:state.draft.effectWork;obj[key]=el.type==='number'?(el.value===''?'':Number(el.value)):el.value;persist();}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.quick&&active?.type==='detail'){const i=state.items.find(v=>v.id===active.id);i[el.dataset.quick]=el.checked;persist();home();showItem(i.id);requestAnimationFrame(()=>document.querySelector(`[data-quick="${el.dataset.quick}"]`)?.focus({preventScroll:true}));}});
document.addEventListener('submit',event=>{if(event.target.id==='answer-form'){event.preventDefault();const action=$('#editor .dialog-foot .primary')?.dataset.action;if(action)dispatch(action);}});
$('#editor').addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
document.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(button&&!button.disabled)dispatch(button.dataset.action,button.dataset.value);});
function dispatch(action,value){const d=state.draft,e=d?.effectWork;
switch(action){
case 'scenario':startScenario(value);break;
case 'catalog':openCatalog(value);break;
case 'close':closeDialog();break;
case 'direct':directAdd(value);break;
case 'customize':{const b=bases.find(v=>v.id===value);startItem(b.group,b.id);break;}
case 'custom':startItem(value,null);break;
case 'resume':active={type:'wizard'};renderWizard();break;
case 'discard':if(confirm('Forkaste det uferdige utkastet? Lagrede gjenstander beholdes.')){state.draft=null;persist();home();}break;
case 'detail':showItem(value);break;
case 'edit-item':{const i=state.items.find(v=>v.id===value);startItem(i.group,i.baseId,i);break;}
case 'next':if(capture())go('effects');break;
case 'back':back();break;
case 'matrix':go('matrix');break;
case 'target':beginEffect(value);break;
case 'effect-edit':{const v=d.item.effects.find(v=>v.id===value);beginEffect(v.target,v);break;}
case 'operation':e.operation=value;effectGo('amount');break;
case 'subject':e.subject=value;e.operation='add';effectGo('amount');break;
case 'die':e.die=Number(value);effectGo('count');break;
case 'immunity-kind':e.immunityKind=value;effectGo(value==='damage'?'damage-type':'condition-type');break;
case 'damage-type':if(e.target==='extra')e.damageType=value;else e.subject=value;effectGo('condition-ask');break;
case 'condition-type':e.subject=value;effectGo('condition-ask');break;
case 'condition-answer':if(value==='yes')effectGo('condition-text');else{delete e.condition;effectGo('done');}break;
case 'limited-answer':e.limited=value==='yes';effectGo(e.limited?'maximum':'done');break;
case 'recharge':e.recharge=value;effectGo('done');break;
case 'effect-next':effectNext();break;
case 'effect-remove':if(confirm('Fjerne denne virkningen fra utkastet?')){d.item.effects=d.item.effects.filter(v=>v.id!==e.id);d.screen='effects';d.history=[{screen:'name'}];d.effectWork=null;persist();renderWizard();}break;
case 'settings':go('settings');break;
case 'setting':setting(value);break;
case 'setting-next':if(capture()){d.screen='settings';d.history.pop();persist();renderWizard();}break;
case 'settings-done':d.screen='effects';d.history.pop();persist();renderWizard();break;
case 'attunement-answer':d.item.requiresAttunement=value==='yes';if(!d.item.requiresAttunement)d.item.attuned=false;d.screen='settings';d.history.pop();persist();renderWizard();break;
case 'finish':finish();break;
case 'grip':case 'attack-mode':{const i=state.items.find(v=>v.id===active.id);i[action==='grip'?'grip':'attackMode']=value;persist();showItem(i.id);break;}
case 'use':counter(value,-1);break;
case 'return-use':counter(value,1);break;
case 'remove-item':if(confirm('Fjerne gjenstanden fra utstyrslisten? Dette er ikke det samme som å slå av I bruk.')){state.removed=clone(state.items.find(v=>v.id===value));state.items=state.items.filter(v=>v.id!==value);if(state.draft?.originalId===value)state.draft=null;persist();closeDialog();}break;
case 'undo':if(state.removed){state.items.push(state.removed);state.removed=null;persist();home();}break;
case 'export':exportData();break;
case 'reset':if(confirm('Slette alle prøvegjenstander og utkast i denne prototypen? Hovedappen berøres ikke.')){state=emptyState();storageBlocked=false;storageError='';persist();home();}break;
}}
home();
</script>
</body>
</html>
