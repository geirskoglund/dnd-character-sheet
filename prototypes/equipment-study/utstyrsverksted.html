<script>
'use strict';
// Standalone interaction study: no app imports, network, service worker or character data.
const KEY='dnd-equipment-study-v1';
const $=s=>document.querySelector(s);
const clone=v=>JSON.parse(JSON.stringify(v));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'study-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const paths={sword:'M5 19 17 7m-2-3 5 0 0 5M4 14l6 6M3 21l3-3M7 16l9-12 4 4-12 9',shield:'M12 3 3 6v6c0 5 9 9 9 9s9-4 9-9V6l-9-3Zm0 3v12M7 10h10',amulet:'M7 3 4 8l8 6 8-6-3-5M12 14v2m-4 3 4-4 4 4-4 4-4-4',spark:'m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5L12 2Zm6 0v4m-2-2h4',bag:'M7 8V6a5 5 0 0 1 10 0v2M5 8h14l2 14H3L5 8Zm3 5h8v5H8z',heart:'M12 21 3 12C-3 4 7-1 12 6c5-7 15-2 9 6l-9 9Z',book:'M12 5C8 2 4 3 2 4v16c4-2 7-1 10 1 3-2 6-3 10-1V4c-2-1-6-2-10 1Zm0 0v16',check:'m5 12 4 4L20 5',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4v5l4 2',arrow:'M4 12h16m-6-6 6 6-6 6',armor:'m8 3 4 3 4-3 5 6-4 3v9H7v-9L3 9l5-6Zm0 0v6l4 3 4-3V3'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.spark}"/></svg>`;
const groups={weapon:'Våpen',armor:'Armor og skjold',other:'Annet utstyr'};
const groupIcon=g=>({weapon:'sword',armor:'shield',other:'bag'}[g]);
const bases=[
{id:'warhammer',name:'Warhammer',group:'weapon',icon:'sword',summary:'1d8 bludgeoning',detail:'Martial melee weapon. Versatile: 1d10 med to hender.',grips:true,properties:['Versatile']},
{id:'longsword',name:'Longsword',group:'weapon',icon:'sword',summary:'1d8 slashing',detail:'Martial melee weapon. Versatile: 1d10 med to hender.',grips:true,properties:['Versatile']},
{id:'dagger',name:'Dagger',group:'weapon',icon:'sword',summary:'1d4 piercing',detail:'Simple melee weapon. Finesse, light, thrown (20/60 ft.).',thrown:true,properties:['Finesse','Light','Thrown 20/60 ft.']},
{id:'shortbow',name:'Shortbow',group:'weapon',icon:'sword',summary:'1d6 piercing',detail:'Simple ranged weapon. Ammunition (80/320 ft.), two-handed.',properties:['Ammunition 80/320 ft.','Two-handed']},
{id:'greataxe',name:'Greataxe',group:'weapon',icon:'sword',summary:'1d12 slashing',detail:'Martial melee weapon. Heavy, two-handed.',properties:['Heavy','Two-handed']},
{id:'leather',name:'Leather',group:'armor',icon:'armor',summary:'AC 11 + Dexterity modifier',detail:'Light armor. Hele settet registreres som én gjenstand.',properties:['Light armor']},
{id:'chainmail',name:'Chain Mail',group:'armor',icon:'armor',summary:'AC 16',detail:'Heavy armor. Strength 13; disadvantage på Stealth. Hele settet registreres samlet.',properties:['Heavy armor','Strength 13','Stealth disadvantage']},
{id:'shield',name:'Shield',group:'armor',icon:'shield',summary:'+2 AC',detail:'Skjold gir +2 AC når det brukes. Grunnverdien følger skjoldet.',properties:['Shield']},
{id:'amulet',name:'Amulett',group:'other',icon:'amulet',summary:'Amulett',detail:'Amulett som grunnmodell. Gjenstandens egne virkninger står i oppslaget.',properties:[]},
{id:'ring',name:'Ring',group:'other',icon:'spark',summary:'Ring',detail:'Et generisk eksempelgrunnlag for denne prøven, ikke en katalogført magisk gjenstand.',properties:[]},
{id:'cloak',name:'Kappe',group:'other',icon:'bag',summary:'Kappe',detail:'Kappe som grunnmodell. Gjenstandens egne virkninger står i oppslaget.',properties:[]}
];
const baseOf=i=>bases.find(b=>b.id===i.baseId);
const itemName=i=>i.name?.trim()||baseOf(i)?.name||'Uten navn';
const itemIcon=i=>baseOf(i)?.icon||groupIcon(i.group);
const abilities=['Strength','Dexterity','Constitution','Intelligence','Wisdom','Charisma'];
const skills=['Acrobatics','Animal Handling','Arcana','Athletics','Deception','History','Insight','Intimidation','Investigation','Medicine','Nature','Perception','Performance','Persuasion','Religion','Sleight of Hand','Stealth','Survival'];
const damageTypes=['Acid','Bludgeoning','Cold','Fire','Force','Lightning','Necrotic','Piercing','Poison','Psychic','Radiant','Slashing','Thunder'];
const conditions=['Blinded','Charmed','Deafened','Frightened','Grappled','Incapacitated','Paralyzed','Petrified','Poisoned','Prone','Restrained','Stunned','Unconscious'];
const targets=[...abilities.map(name=>({id:'ability:'+name,name,group:'Ability scores',icon:'heart',kind:'number'})),
...['AC','Angrep','Skade','Initiative','Speed','Maks HP'].map(name=>({id:'combat:'+name,name:name==='Skade'?'Skadebonus':name==='Angrep'?'Angrepsbonus':name,group:'Kamp og bevegelse',icon:'sword',kind:'number'})),
{id:'extra',name:'Ekstraskade',group:'Kamp og bevegelse',icon:'sword',kind:'extra'},
{id:'skill',name:'Skill',group:'Ferdigheter og saves',icon:'book',kind:'skill'},
{id:'save',name:'Saving throw',group:'Ferdigheter og saves',icon:'book',kind:'save'},
{id:'resistance',name:'Resistance',group:'Beskyttelse',icon:'shield',kind:'defense'},
{id:'immunity',name:'Immunity',group:'Beskyttelse',icon:'shield',kind:'immunity'},
{id:'vulnerability',name:'Vulnerability',group:'Beskyttelse',icon:'shield',kind:'defense'},
{id:'ability',name:'Effekt',group:'Andre effekter',icon:'spark',kind:'ability'}];
const targetOf=e=>targets.find(t=>t.id===e.target);
const rechargeLabels={short:'Short rest',long:'Long rest',dawn:'Daggry',manual:'Manuelt'};
let storageError='',storageBlocked=false,active=null,lastFocus=null,view='equipment',combatTab='action';
const placementLabels={action:'Action',bonus:'Bonus Action',reaction:'Reaction',other:'Andre egenskaper'};
const handLabels={none:'Ikke i bruk',left:'Venstre hånd',right:'Høyre hånd',both:'Begge hender'};
const defaultDemo=()=>({strength:14,dexterity:16,proficiency:2,twoWeaponStyle:false});
const emptyState=()=>({version:2,items:[],draft:null,removed:null,demo:defaultDemo()});
function validItem(i){return i&&typeof i.id==='string'&&Object.hasOwn(groups,i.group)&&typeof i.name==='string'&&Array.isArray(i.effects)&&i.effects.every(e=>e&&typeof e.id==='string'&&targets.some(t=>t.id===e.target));}
function normalizeItem(i){
  i.effects.forEach(e=>{if(e.operation==='set'&&e.target.startsWith('ability:'))e.operation='floor';if(e.target==='ability'&&!Array.isArray(e.placements))e.placements=['other'];});
  if(i.group==='weapon'){
    i.hand=i.hand||((i.equipped)?(i.grip==='two'||baseOf(i)?.properties.includes('Two-handed')?'both':'right'):'none');
    delete i.quantity;i.equipped=i.hand!=='none';
  }
  return i;
}
function duplicateItem(i){const copy=clone(i);copy.id=uid();copy.effects.forEach(e=>e.id=uid());copy.equipped=false;copy.attuned=false;if(copy.group==='weapon')copy.hand='none';return copy;}
function upgrade(s){
  if(![1,2].includes(s.version)||!Array.isArray(s.items)||!s.items.every(validItem)||s.draft&&(!validItem(s.draft.item)||typeof s.draft.screen!=='string'))throw Error('format');
  const items=[];
  for(const old of s.items){const qty=old.group==='weapon'?Math.max(1,Math.min(999,Number(old.quantity)||1)):1;const item=normalizeItem(old);items.push(item);for(let n=1;n<qty;n++)items.push(duplicateItem(item));}
  s.items=items;s.version=2;s.demo={...defaultDemo(),...s.demo};
  if(s.draft){const d=s.draft;normalizeItem(d.item);d.history??=[];d.effectHistory??=[];
    if(d.item.group==='weapon'&&d.screen==='quantity')d.screen='effects';

function load(){try{const raw=localStorage.getItem(KEY);return raw?upgrade(JSON.parse(raw)):emptyState();}catch{storageError='Prøvedata kunne ikke leses. Dataene er ikke overskrevet. Last ned prøvedata eller tilbakestill prøven for å starte på nytt.';storageBlocked=true;return emptyState();}}

function showStorageError(){for(const el of document.querySelectorAll('[data-storage-error]'))el.innerHTML=storageError?`<p>${esc(storageError)}</p><button data-action="export">Last ned prøvedata</button>`:'';}
function persist(){

  try{localStorage.setItem(KEY,JSON.stringify(state));storageError='';showStorageError();return true;}
  catch{storageError='Kunne ikke lagre i nettleseren. Endringen er ikke bekreftet. Svarene er fortsatt her; la filen være åpen eller last ned prøvedata.';showStorageError();return false;}
}
function isUsed(i){return i.group==='weapon'?i.hand!=='none':!!i.equipped;}
function magicActive(i){return !i.requiresAttunement||!!i.attuned;}
function activeSources(){return state.items.filter(i=>isUsed(i)&&magicActive(i));}
function abilityScore(name){
  const base=name==='Strength'?Number(state.demo.strength):name==='Dexterity'?Number(state.demo.dexterity):14;
  const effects=activeSources().flatMap(i=>i.effects).filter(e=>e.target==='ability:'+name&&!e.condition);
  const total=base+effects.filter(e=>e.operation==='add').reduce((n,e)=>n+Number(e.amount),0);
  return Math.max(total,...effects.filter(e=>e.operation==='floor').map(e=>Number(e.amount)));

function signed(n,spaces=false){return n===0?'':(n>0?(spaces?' + ':'+'):(spaces?' − ':'−'))+Math.abs(n);}
function abilityFor(i){const b=baseOf(i);if(b?.id==='shortbow')return 'Dexterity';if(b?.properties.includes('Finesse'))return abilityScore('Dexterity')>=abilityScore('Strength')?'Dexterity':'Strength';return 'Strength';}
function modifier(name){return Math.floor((abilityScore(name)-10)/2);}
function sumBonus(i,target){const own=magicActive(i)?i.effects.filter(e=>e.target===target&&e.operation==='add'&&!e.condition):[];const others=activeSources().filter(v=>v.id!==i.id&&v.group!=='weapon').flatMap(v=>v.effects).filter(e=>e.target===target&&e.operation==='add'&&!e.condition);return [...own,...others].reduce((n,e)=>n+Number(e.amount),0);}
function weaponMath(i,bonusAttack=false){
  const b=baseOf(i);if(!b||b.group!=='weapon')return null;
  const ability=abilityFor(i),mod=modifier(ability),damageBonus=sumBonus(i,'combat:Skade');
  const dice=(i.hand==='both'&&b.grips?'1d10':b.summary.split(' ')[0]);
  const type=b.summary.split(' ').slice(1).join(' ');
  const applied=bonusAttack&&!state.demo.twoWeaponStyle?Math.min(0,mod):mod;
  return {damage:dice+signed(applied+damageBonus,true)+' '+type,attack:'d20'+signed(mod+Number(state.demo.proficiency)+sumBonus(i,'combat:Angrep'),true),ability,mod,applied,damageBonus,dice};
}
function extraLines(i){return magicActive(i)?i.effects.filter(e=>e.target==='extra'||e.target==='combat:Skade'&&e.condition).map(e=>`<p class="extra-line">${e.target==='extra'?`+ ${e.count}d${e.die} ${esc(e.damageType.toLowerCase())}`:`${signed(Number(e.amount))||'0'} skadebonus`}${e.condition?` · ${esc(e.condition)}`:''}</p>`).join(''):'';}
function damageBlock(i,bonus=false){const m=weaponMath(i,bonus);return m?`<div class="damage-block"><small>SKADE</small><strong>${esc(m.damage)}</strong>${extraLines(i)}</div>`:'';}
function effectSummary(e){const t=targetOf(e);if(!t)return {title:'Ukjent virkning',value:''};
  if(['number','skill','save'].includes(t.kind)){const title=t.kind==='skill'?e.subject:t.kind==='save'?e.subject==='Alle saving throws'?e.subject:e.subject+' saving throw':t.name;return {title,value:e.operation==='floor'?'Minst '+e.amount:e.operation==='set'?'Settes til '+e.amount:Number(e.amount)>=0?'+'+e.amount:'−'+Math.abs(e.amount)};}
  if(t.kind==='extra')return {title:'Ekstraskade',value:`+${e.count}d${e.die} ${(e.damageType||'').toLowerCase()}`};
  if(t.kind==='defense'||t.kind==='immunity')return {title:t.name,value:e.subject||''};
  return {title:'Effekt',value:e.limited?`${e.remaining??e.max}/${e.max} · ${rechargeLabels[e.recharge]}`:''};
}
function home(){const d=state.draft;

function resourceMarkup(i,e){return e.limited?`<div class="resource-counter"><button aria-label="Bruk én: ${esc(e.description)}" data-action="use" data-item="${i.id}" data-value="${e.id}" ${e.remaining<=0?'disabled':''}>−</button><output aria-label="Tilgjengelige bruk">${e.remaining} / ${e.max}</output><button aria-label="Gi tilbake én: ${esc(e.description)}" data-action="return-use" data-item="${i.id}" data-value="${e.id}" ${e.remaining>=e.max?'disabled':''}>+</button><small>${esc(rechargeLabels[e.recharge])}</small></div>`:'';}

function dialogFrame(title,body,footer='',subtitle=''){

  dialogFrame(d.originalId?'Rediger gjenstanden':'Ny gjenstand',body,footer,itemName(i));
}
function firstQuestion(t,e){if(t.kind==='number')return e.target.startsWith('ability:')?'operation':'amount';return t.kind==='extra'?'die':t.kind==='skill'?'skill':t.kind==='save'?'save':t.kind==='immunity'?'immunity-kind':t.kind==='defense'?'damage-type':'description';}
function beginEffect(target,existing=null){const d=state.draft;
  if(target==='ability'&&!existing)existing=d.item.effects.find(e=>e.target==='ability');
  d.history.push({screen:d.screen});d.screen='effect';d.effectHistory=[];d.error='';
  const resume=d.effectWork?.target===target&&(existing?d.effectWork.id===existing.id:!d.effectOriginal);
  if(!resume){d.effectWork=existing?clone(existing):{id:uid(),target,operation:'add'};d.effectOriginal=existing?clone(existing):null;}
  if(target==='ability')d.effectWork.placements??=[];
  d.effectQ=firstQuestion(targetOf(d.effectWork),d.effectWork);persist();renderWizard();
}
function effectGo(q){if(q==='done'){saveEffect();return;}const d=state.draft;d.effectHistory.push(d.effectQ);d.effectQ=q;d.error='';persist();renderWizard();}
function effectQuestion(){const d=state.draft,e=d.effectWork,t=targetOf(e),title=t.kind==='skill'?e.subject||'Skill':t.kind==='save'?e.subject||'Saving throw':t.name;let heading='',help='',content='',next=false,button='';
  switch(d.effectQ){
  case 'operation':heading=`Hvordan påvirkes ${title}?`;help=`Velg om gjenstanden gir et bidrag til ${title} eller hever verdien til en nedre grense.`;content=`<div class="choices">${choice('Øk eller reduser med','operation','add',`Et bidrag som legges til ${title}.`)}${choice('Hev til minst','operation','floor',`${title} heves til den angitte verdien. En høyere verdi beholdes.`)}</div>`;break;
  case 'amount':heading=e.operation==='floor'?`Hva skal ${title} minst være?`:e.target==='combat:Skade'?'Hvor stor er skadebonusen?':`Hva er bidraget til ${title}?`;help=e.operation==='floor'?`${title} heves til denne verdien hvis den ellers er lavere. Grunnverdien beholdes.`:e.target==='combat:Skade'?'Legges til våpenets skade. Et negativt tall reduserer skaden.':e.target==='combat:Angrep'?'Legges til våpenets angrepskast. Et negativt tall reduserer bonusen.':`Legges til ${title}. Bruk et positivt tall for å øke eller et negativt tall for å redusere.`;content=answerForm(inputField(e.target==='combat:Skade'?'Skadebonus':'Verdi','effect.amount',e.amount??'','number',`required min="${e.operation==='floor'?1:-100}" max="999" step="1" class="number-entry" data-autofocus`));next=true;break;
  case 'skill':heading='Hvilken skill påvirkes?';help='Velg ferdigheten som skal få bidraget.';content=`<div class="choices two">${skills.map(v=>choice(v,'subject',v)).join('')}</div>`;break;
  case 'save':heading='Hvilke saving throws påvirkes?';help='Velg én ability eller alle saving throws.';content=`<div class="choices two">${[...abilities,'Alle saving throws'].map(v=>choice(v,'subject',v)).join('')}</div>`;break;
  case 'die':heading='Hvilken terning gir ekstraskaden?';help='Velg terningtypen som skal komme i tillegg til grunnskaden.';content=`<div class="dice">${[4,6,8,10,12,20].map(n=>`<button class="die" aria-label="d${n}" data-action="die" data-value="${n}"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3 44 17v18L24 45 4 35V17L24 3Zm0 0v42M4 17l20 9 20-9M4 35l20-9 20 9"/></svg><span>d${n}</span></button>`).join('')}</div>`;break;
  case 'count':heading=`Hvor mange d${e.die}?`;help='Antall terninger du kaster for denne ekstraskaden.';content=answerForm(inputField('Antall terninger','effect.count',e.count??1,'number','required min="1" max="99" step="1" class="number-entry" data-autofocus'));next=true;break;
  case 'immunity-kind':heading='Hva gir den immunitet mot?';help='Velg om immuniteten gjelder en skadetype eller en tilstand.';content=`<div class="choices">${choice('En skadetype','immunity-kind','damage','For eksempel Fire damage.')}${choice('En tilstand','immunity-kind','condition','For eksempel Frightened.')}</div>`;break;
  case 'damage-type':heading=t.kind==='extra'?'Hvilken skadetype har ekstraskaden?':`Hvilken skadetype gjelder ${t.name.toLowerCase()}?`;help=t.kind==='extra'?'Velg typen for denne tilleggsskaden. Grunnskadens type beholdes.':'Velg skadetypen som er angitt for virkningen.';content=`<div class="choices three">${damageTypes.map(v=>choice(v,'damage-type',v)).join('')}</div>`;break;
  case 'condition-type':heading='Hvilken tilstand er du immun mot?';help='Velg tilstanden som er angitt for immuniteten.';content=`<div class="choices two">${conditions.map(v=>choice(v,'condition-type',v)).join('')}</div>`;break;
  case 'condition-ask':heading=t.kind==='extra'?'Gjelder ekstraskaden bare under en betingelse?':`Gjelder ${title.toLowerCase()} bare under en betingelse?`;help=`En betingelse beskriver når akkurat ${t.kind==='extra'?'denne ekstraskaden':'dette bidraget'} gjelder. Du og DM vurderer om den er oppfylt.`;content=yesNo('condition-answer');break;
  case 'condition-text':heading='Når gjelder virkningen?';help='Skriv vilkåret for akkurat denne virkningen. Teksten vises sammen med den.';content=answerForm(textField('Betingelse','effect.condition',e.condition||'','required maxlength="500" placeholder="Når …" data-autofocus'));next=true;break;
  case 'description':heading='Hva gjør effekten?';help='Beskriv den spillmessige virkningen med egne ord. Du trenger ingen kobling til en spell.';content=answerForm(textField('Effektbeskrivelse','effect.description',e.description||'','required maxlength="2000" data-autofocus'));next=true;break;
  case 'placements':heading='Hvor skal effekten vises i Combat?';help='Velg én eller flere kategorier. Beskrivelsen og brukstelleren deles mellom oppslagene.';content=`<div class="choices two">${Object.entries(placementLabels).map(([k,v])=>`<button class="choice" data-action="placement" data-value="${k}" aria-pressed="${e.placements?.includes(k)}">${v}</button>`).join('')}</div>`;next=true;break;
  case 'limited':heading='Har effekten et begrenset antall bruk?';help='Velg Ja for å føre forbruk. Selve effekten håndterer du ved bordet.';content=yesNo('limited-answer');break;
  case 'maximum':heading='Hvor mange bruk har effekten?';help=d.effectOriginal?.limited?'Endre maks antall. Bruk som allerede er brukt, beholdes.':'Alle bruk blir tilgjengelige når effekten opprettes.';content=answerForm(inputField('Maks antall bruk','effect.max',e.max??'','number','required min="1" max="99" step="1" class="number-entry" data-autofocus'));next=true;break;
  case 'recharge':heading='Når får du brukene tilbake?';help='Velg gjenopprettingen som gjelder denne effekten.';content=`<div class="choices two">${Object.entries(rechargeLabels).map(([k,v])=>choice(v,'recharge',k)).join('')}</div>`;break;
  }
  return {body:question(heading,help,content,t.icon),next,button};
}
function capture(){const form=$('#answer-form');if(form&&!form.reportValidity())return false;if(form){const el=form.querySelector('[data-field]'),[owner,key]=el.dataset.field.split('.');(owner==='item'?state.draft.item:state.draft.effectWork)[key]=el.type==='number'?Number(el.value):el.value.trim();}return true;}
function effectMissing(e){const t=targetOf(e);if(!t)return ['description','Velg en virkning.'];
  if(['number','skill','save'].includes(t.kind)){if(t.kind==='skill'&&!e.subject)return ['skill','Velg skill.'];if(t.kind==='save'&&!e.subject)return ['save','Velg saving throw.'];if(e.amount===''||e.amount==null||!Number.isInteger(Number(e.amount)))return ['amount','Angi beløpet for '+t.name+'.'];if(Number(e.amount)<(e.operation==='floor'?1:-100)||Number(e.amount)>999)return ['amount','Verdien er utenfor tillatt område.'];}
  if(t.kind==='extra'){if(!e.die)return ['die','Velg terningtype for ekstraskaden.'];if(!Number.isInteger(Number(e.count))||e.count<1||e.count>99)return ['count','Angi antall terninger.'];if(!damageTypes.includes(e.damageType))return ['damage-type','Velg skadetype for ekstraskaden.'];}
  if(['defense','immunity'].includes(t.kind)&&!e.subject)return [e.immunityKind==='condition'?'condition-type':'damage-type','Velg hva beskyttelsen gjelder.'];
  if(t.kind==='ability'){if(!e.description?.trim())return ['description','Skriv hva effekten gjør.'];if(!e.placements?.length)return ['placements','Velg minst én Combat-kategori.'];if(e.limited){if(!Number.isInteger(Number(e.max))||e.max<1||e.max>99)return ['maximum','Angi maks antall bruk fra 1 til 99.'];if(!Object.hasOwn(rechargeLabels,e.recharge))return ['recharge','Velg når brukene gjenopprettes.'];}}
  if(e.conditionRequired&&!e.condition?.trim())return ['condition-text','Skriv betingelsen, eller gå tilbake og velg Nei.'];
  return null;
}
function putEffect(){const d=state.draft,e=d.effectWork;if(!e)return true;const missing=effectMissing(e);if(missing){d.screen='effect';d.effectQ=missing[0];d.error=missing[1];persist();renderWizard();return false;}
  if(e.target==='ability'&&e.limited){const used=d.effectOriginal?.limited?Math.max(0,d.effectOriginal.max-(d.effectOriginal.remaining??d.effectOriginal.max)):0;e.remaining=Math.max(0,Number(e.max)-used);}else{delete e.max;delete e.remaining;delete e.recharge;}
  delete e.conditionRequired;const n=d.item.effects.findIndex(v=>v.id===e.id);if(n>=0)d.item.effects[n]=clone(e);else d.item.effects.push(clone(e));d.effectWork=null;d.effectOriginal=null;d.effectHistory=[];d.error='';return true;
}
function saveEffect(){if(!putEffect())return;const d=state.draft;d.screen='effects';d.history=[{screen:'name'}];persist();renderWizard();}
function effectNext(){if(!capture())return;const d=state.draft,e=d.effectWork;if(d.effectQ==='placements'&&!e.placements.length){d.error='Velg minst én kategori.';renderWizard();return;}const next={amount:'condition-ask',count:'damage-type','condition-text':'done',description:'placements',placements:'limited',maximum:'recharge'}[d.effectQ];if(next)effectGo(next);}
function back(){const d=state.draft;d.error='';if(d.screen==='effect'&&d.effectHistory.length)d.effectQ=d.effectHistory.pop();else{const prev=d.history.pop();d.screen=prev?.screen||'effects';}persist();renderWizard();}
function requestSave(){const d=state.draft;if(!capture()||!putEffect())return;if(d.screen==='effect')d.screen='effects';if(!d.item.name.trim()&&!baseOf(d.item)){d.screen='name';d.error='Skriv navnet på gjenstanden.';renderWizard();return;}if(d.item.group!=='weapon'&&(!Number.isInteger(Number(d.item.quantity))||d.item.quantity<1||d.item.quantity>999)){d.screen='quantity';d.error='Angi antall fra 1 til 999.';renderWizard();return;}
  if(!isUsed(d.item)){go('use');return;}commitItem();
}
function conflict(i,hand){if(hand==='none')return false;const others=state.items.filter(v=>v.id!==i.id&&isUsed(v));const occupied=others.some(v=>v.group==='weapon'&&(hand==='both'||v.hand==='both'||v.hand===hand));const shield=others.some(v=>v.baseId==='shield')&&(hand==='both'||others.some(v=>v.group==='weapon'&&v.hand!==hand));return occupied||shield;}
function chooseHand(i,hand){if(conflict(i,hand)&&!confirm('En hånd kan allerede være opptatt. Beholde dette oppsettet som et DM-unntak?'))return false;i.hand=hand;i.equipped=hand!=='none';return true;}
function commitItem(){const d=state.draft,items=state.items;const copy=clone(d.item),n=items.findIndex(v=>v.id===d.originalId);if(d.originalId&&n<0){d.error='Gjenstanden finnes ikke lenger. Utkastet er beholdt.';renderWizard();return;}
  state.items=n>=0?items.map((v,k)=>k===n?copy:v):[...items,copy];state.draft=null;
  if(!persist()){state.items=items;state.draft=d;renderWizard();return;}view='equipment';closeDialog(true);
}
function showItem(id){const i=state.items.find(v=>v.id===id);if(!i)return;active={type:'detail',id};const b=baseOf(i),m=weaponMath(i);const nonDamage=i.effects.filter(e=>!['combat:Skade','extra'].includes(e.target)||i.group!=='weapon');
  dialogFrame(itemName(i),`<p class="base-summary">${icon(itemIcon(i))} ${esc(b?.name||'Egen gjenstand')}</p>
  ${i.group==='weapon'?`<section aria-label="Håndbruk">${handChoices(i,'hand')}</section>`:`<div class="quick-controls"><label class="toggle"><input type="checkbox" data-quick="equipped" ${i.equipped?'checked':''}>I bruk</label></div>`}
  ${i.requiresAttunement?`<label class="toggle"><input type="checkbox" data-quick="attuned" ${i.attuned?'checked':''}>Attuned</label>${!i.attuned?'<p class="form-help">Magiske virkninger krever attunement.</p>':''}`:''}
  ${b?.thrown?`<div class="quick-controls" aria-label="Angrepsmåte"><button data-action="attack-mode" data-value="melee" aria-pressed="${i.attackMode==='melee'}">Melee</button><button data-action="attack-mode" data-value="thrown" aria-pressed="${i.attackMode==='thrown'}">Thrown</button></div>`:''}
  ${damageBlock(i)}${nonDamage.length?`<section class="detail-section"><h3>Virkninger</h3><div class="read-effects">${nonDamage.map(e=>{const s=effectSummary(e);return `<div class="read-effect">${e.target==='ability'?`<strong>Andre effekter</strong><p class="effect-description">${esc(e.description)}</p><small>${esc((e.placements||['other']).map(k=>placementLabels[k]).join(' · '))}</small>${resourceMarkup(i,e)}`:`<strong>${esc(s.title)} · ${esc(s.value)}</strong>${e.condition?`<p>${esc(e.condition)}</p>`:''}`}</div>`;}).join('')}</div></section>`:''}
  ${i.note?`<section class="detail-section"><h3>Merknad om gjenstanden</h3><p class="note">${esc(i.note)}</p></section>`:''}
  ${b?`<details class="disclosure"><summary>${m?'Beregningsgrunnlag':'Grunnlag fra '+esc(b.name)}</summary><div class="disclosure-content"><p>${esc(b.detail)}</p>${m?`<p>Grunnskade ${esc(m.dice)}, ${esc(m.ability)} modifier ${signed(m.mod)||'0'}, skadebonus ${signed(m.damageBonus)||'0'}.</p><p>Prøveverdier fra Combat. Betingede bidrag vurderes manuelt.</p>`:''}<div class="properties">${b.properties.map(p=>`<span>${esc(p)}</span>`).join('')}</div></div></details>`:''}
  ${i.group!=='weapon'&&i.quantity!==1?`<p>Antall: ${i.quantity}</p>`:''}<div class="edit-tools"><button class="corner" data-action="edit-item" data-value="${id}">Rediger gjenstanden</button><button data-action="copy-item" data-value="${id}">Kopier</button></div><div class="destructive"><button class="danger" data-action="remove-item" data-value="${id}">Fjern fra utstyrslisten</button></div>`,'','Oppslag · bruk og egenskaper');
}
function updateSaved(fn,redraw=true){const before=clone(state),demoOpen=document.querySelector('.demo-settings')?.open;fn();if(!persist()){const error=storageError;state=before;storageError=error;showStorageError();return false;}if(redraw){home();if(demoOpen&&document.querySelector('.demo-settings'))document.querySelector('.demo-settings').open=true;if(active?.type==='detail')showItem(active.id);}return true;}
function counter(itemId,effectId,delta){updateSaved(()=>{const e=state.items.find(i=>i.id===itemId)?.effects.find(e=>e.id===effectId);if(e?.limited)e.remaining=Math.max(0,Math.min(e.max,e.remaining+delta));});const action=delta<0?'use':'return-use';requestAnimationFrame(()=>{const scope=active?.type==='detail'?$('#editor'):$('#workspace');const buttons=[...scope.querySelectorAll('[data-value]')].filter(b=>b.dataset.value===effectId&&!b.disabled);(buttons.find(b=>b.dataset.action===action)||buttons[0])?.focus({preventScroll:true});});}
function exportData(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='utstyrsverksted-provedata.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('input',event=>{const el=event.target;if(el.dataset.input==='search'){active.query=el.value;$('#catalog-results').innerHTML=catalogResults(bases.filter(b=>b.group===active.group&&b.name.toLowerCase().includes(el.value.toLowerCase())),active.group);return;}if(el.dataset.field&&state.draft){const [owner,key]=el.dataset.field.split('.');(owner==='item'?state.draft.item:state.draft.effectWork)[key]=el.type==='number'?(el.value===''?'':Number(el.value)):el.value;persist();}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.quick&&active?.type==='detail'){updateSaved(()=>{state.items.find(i=>i.id===active.id)[el.dataset.quick]=el.checked;});requestAnimationFrame(()=>document.querySelector(`[data-quick="${el.dataset.quick}"]`)?.focus({preventScroll:true}));}if(el.dataset.demo){if(el.type==='number'&&!el.reportValidity())return;updateSaved(()=>{state.demo[el.dataset.demo]=el.type==='checkbox'?el.checked:Number(el.value);});}});
document.addEventListener('submit',event=>{if(event.target.id==='answer-form'){event.preventDefault();const action=$('#editor .dialog-foot .primary')?.dataset.action;if(action)dispatch(action);}});
$('#editor').addEventListener('cancel',event=>{event.preventDefault();closeDialog();});
document.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(b&&!b.disabled)dispatch(b.dataset.action,b.dataset.value,b.dataset.item);});
function dispatch(action,value,itemId){const d=state.draft,e=d?.effectWork;switch(action){
case 'view':view=value;home();break;
case 'combat-tab':combatTab=value;home();break;
case 'scenario':startItem(value==='weapon'?'weapon':'other',value==='weapon'?'warhammer':value==='amulet'?'amulet':null);break;
case 'catalog':openCatalog(value);break;
case 'close':closeDialog();break;
case 'direct':directAdd(value);break;
case 'customize':{const b=bases.find(b=>b.id===value);startItem(b.group,b.id);break;}
case 'custom':startItem(value,null);break;
case 'resume':renderWizard();break;
case 'discard':if(confirm('Forkaste utkastet? Lagrede gjenstander beholdes.')){const old=state.draft;state.draft=null;if(!persist())state.draft=old;home();}break;
case 'detail':showItem(value);break;
case 'edit-item':{const i=state.items.find(i=>i.id===value);startItem(i.group,i.baseId,i);break;}
case 'copy-item':{const i=state.items.find(i=>i.id===value);if(updateSaved(()=>state.items.push(duplicateItem(i)),false))closeDialog(true);break;}
case 'next':if(capture())go('effects');break;
case 'back':back();break;
case 'matrix':go('matrix');break;
case 'target':beginEffect(value);break;
case 'effect-edit':{const old=d.item.effects.find(e=>e.id===value);beginEffect(old.target,old);break;}
case 'operation':e.operation=value;effectGo('amount');break;
case 'subject':e.subject=value;e.operation='add';effectGo('amount');break;
case 'die':e.die=Number(value);effectGo('count');break;
case 'immunity-kind':e.immunityKind=value;delete e.subject;effectGo(value==='condition'?'condition-type':'damage-type');break;
case 'damage-type':if(e.target==='extra')e.damageType=value;else e.subject=value;effectGo('condition-ask');break;
case 'condition-type':e.subject=value;effectGo('condition-ask');break;
case 'condition-answer':e.conditionRequired=value==='yes';if(e.conditionRequired)effectGo('condition-text');else{delete e.condition;effectGo('done');}break;
case 'placement':e.placements=e.placements.includes(value)?e.placements.filter(v=>v!==value):[...e.placements,value];persist();renderWizard();break;
case 'limited-answer':e.limited=value==='yes';effectGo(e.limited?'maximum':'done');break;
case 'recharge':e.recharge=value;effectGo('done');break;
case 'effect-next':effectNext();break;
case 'effect-cancel':d.effectWork=null;d.effectOriginal=null;d.effectHistory=[];d.error='';d.screen='effects';d.history=[{screen:'name'}];persist();renderWizard();break;
case 'effect-remove':if(confirm('Fjerne denne virkningen?')){d.item.effects=d.item.effects.filter(v=>v.id!==e.id);d.effectWork=null;d.effectOriginal=null;d.screen='effects';persist();renderWizard();}break;
case 'settings':go('settings');break;
case 'quantity':if(d.item.group!=='weapon')go('quantity');break;
case 'setting':go(value);break;
case 'attunement-answer':d.item.requiresAttunement=value==='yes';if(!d.item.requiresAttunement)d.item.attuned=false;d.screen='effects';persist();renderWizard();break;
case 'save-all':requestSave();break;
case 'save-hand':if(chooseHand(d.item,value))commitItem();break;
case 'save-use':d.item.equipped=value==='yes';commitItem();break;
case 'hand':{const i=state.items.find(v=>v.id===active.id);updateSaved(()=>{chooseHand(i,value);});break;}
case 'attack-mode':updateSaved(()=>state.items.find(i=>i.id===active.id).attackMode=value);break;
case 'use':counter(itemId,value,-1);break;
case 'return-use':counter(itemId,value,1);break;
case 'remove-item':if(confirm('Fjerne gjenstanden fra prøvelisten?')){if(updateSaved(()=>{state.removed=state.items.find(i=>i.id===value);state.items=state.items.filter(i=>i.id!==value);if(state.draft?.originalId===value)state.draft=null;},false))closeDialog(true);}break;
case 'undo':if(state.removed)updateSaved(()=>{state.items.push(state.removed);state.removed=null;});break;
case 'export':exportData();break;
case 'reset':if(confirm('Slette alle prøvedata? Hovedappen berøres ikke.')){const old=state;state=emptyState();storageBlocked=false;if(!persist())state=old;home();}break;
}}
home();
</script>
