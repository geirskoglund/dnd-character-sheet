 (mods.length?'<div class="modifier-list">'+mods.map(m=>'<label class="modifier-toggle '+(m.conditional?'conditional':'')+'"><input type="checkbox" data-mod="'+p.id+'" data-key="'+m.key+'" '+(enabled(p,m)?'checked':'')+'><span><strong>'+E(m.label)+'</strong><small>'+E(m.detail)+'</small></span></label>').join('')+'</div>':'<div class="hint margin">Ingen registrerte skadeegenskaper for denne typen.</div>')+'</div>';
 }).join('');
 area.querySelectorAll('[data-kind]').forEach(el=>el.onchange=()=>{const p=parts.find(p=>p.id===+el.dataset.kind);p.kind=el.value;p.disabled={};renderParts()});
 area.querySelectorAll('[data-mod]').forEach(el=>el.onchange=()=>{const p=parts.find(p=>p.id===+el.dataset.mod);const m=modifiers(p).find(m=>m.key===el.dataset.key);p.disabled[m.key]=!el.checked;drawResult()});
 area.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{const p=parts.find(p=>p.id===+el.dataset.id);p.amount=Math.max(0,p.amount+Number(el.dataset.step));renderParts()});
 area.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{parts=parts.filter(p=>p.id!==+el.dataset.remove);renderParts()});
 area.querySelectorAll('[data-amount]').forEach(el=>el.oninput=()=>{const p=parts.find(p=>p.id===+el.dataset.amount);p.amount=+el.value;const num=area.querySelector('[data-number="'+p.id+'"]');if(num)num.value=p.amount;drawResult()});
 area.querySelectorAll('[data-number]').forEach(el=>el.oninput=()=>{const p=parts.find(p=>p.id===+el.dataset.number);p.amount=Math.max(0,Math.floor(+el.value||0));const sl=area.querySelector('[data-amount="'+p.id+'"]');if(sl){sl.max=Math.max(100,Math.ceil(p.amount/50)*50);sl.value=p.amount;}drawResult()});
 drawResult();
 }
 function drawResult(){const r=calculate(),lines=[];
 lines.push('<div class="damage-line"><span>Innkommende skade</span><b>'+r.incoming+'</b></div>');
 r.entries.forEach((e,i)=>{lines.push('<div class="damage-line"><span>'+E(e.kind)+' · skadepost '+(i+1)+'</span><b>'+e.original+'</b></div>');e.steps.forEach(step=>lines.push('<div class="damage-line"><span>↳ '+E(step.name)+'</span><b>'+(step.after-step.before>=0?'+':'')+(step.after-step.before)+'</b></div>'));});
 lines.push('<div class="damage-line"><span>Etter modifikatorer</span><b>'+r.adjusted+'</b></div>');
 lines.push('<div class="damage-line"><span>Absorbert av Temporary HP</span><b>−'+r.absorbed+'</b></div>');
 lines.push('<div class="damage-line total"><span>Tap av vanlig HP</span><b>'+r.hpLoss+'</b></div>');
 lines.push('<div class="damage-line"><span>HP etter skade</span><b>'+r.newHp+' / '+x.maxHp+'</b></div>');
 lines.push('<div class="damage-line"><span>Temporary HP etter skade</span><b>'+r.newTemp+'</b></div>');
 const say=['Innkommende: '+r.entries.map(e=>e.original+' '+e.kind).join(' + ')+'.'];
 r.entries.forEach(e=>{e.steps.forEach(t=>say.push(e.kind+': '+t.name+' ('+t.before+' → '+t.after+').'))});
 say.push('Etter modifikatorer: '+r.adjusted+'. Temporary HP absorberer '+r.absorbed+'. Vanlig HP mister '+r.hpLoss+'.');
 if(r.excess>0)say.push('Overskytende skade: '+r.excess+' (DM vurderer eventuelle følger).');
 preview.innerHTML='<strong>Beregning</strong>'+lines.join('')+'<div class="dm-summary"><b>Oppsummering til DM</b>\n'+E(say.join(' '))+'</div>';
 apply.disabled=busy;
 }
 d.querySelector('#addDamagePart').onclick=()=>{parts.push({id:nextId++,amount:0,kind:'fire',disabled:{}});renderParts()};
 apply.onclick=()=>{if(busy)return;const result=calculate();snapshot();x.hp=result.newHp;x.tempHp=result.newTemp;busy=true;save();d.close();render()};
 renderParts();
}
function scrollRender(){const y=window.scrollY;scrollMemory[view]=y;render();requestAnimationFrame(()=>window.scrollTo(0,scrollMemory[view]||0))}

render();</script></body></html>
